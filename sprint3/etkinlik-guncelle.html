<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2416501040.css">
    <script type="module" src="js/event-form.js"></script>
</head>
<body>

    <header>
        <h1>Kampüs Etkinlikleri</h1>

        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="etkinlikler.html">Etkinlikler</a></li>
                <li><a href="etkinlik-ekle.html">Ekle</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Etkinlik Güncelle</h2>

            <form id="etkinlik-formu" data-mode="guncelle" novalidate>

                <div class="form-group">
                    <label for="etkinlik-adi">Etkinlik adı</label>
                    <input type="text" id="etkinlik-adi" name="ad">
                    <span id="ad-hata" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori">
                        <option value="">Seçiniz</option>
                        <option value="Seminer">Seminer</option>
                        <option value="Atölye">Atölye</option>
                        <option value="Söyleşi">Söyleşi</option>
                    </select>
                    <span id="kategori-hata" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="tarih">Tarih</label>
                    <input type="date" id="tarih" name="tarih">
                    <span id="tarih-hata" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="saat">Saat</label>
                    <input type="time" id="saat" name="saat">
                    <span id="saat-hata" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="konum">Konum</label>
                    <input type="text" id="konum" name="konum">
                    <span id="konum-hata" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="aciklama">Açıklama</label>
                    <textarea id="aciklama" name="aciklama" rows="3"></textarea>
                    <span id="aciklama-hata" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="kontenjan">Kontenjan</label>
                    <input type="number" id="kontenjan" name="kontenjan">
                    <span id="kontenjan-hata" class="error-text"></span>
                </div>

                <div class="form-group">
                    <button type="submit">Güncelle</button>
                </div>

                <div id="form-mesaj"></div>

            </form>
        </section>
    </main>

    <footer>
        <p>Saimegül Yıldız · 2416501040 · 2026</p>
    </footer>

</body>
</html>
