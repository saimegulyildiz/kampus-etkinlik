<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
</head>
<body>

    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <p>
                <a href="index.html">Ana Sayfa</a> | 
                <a href="etkinlikler.html">Etkinlikler</a> | 
                <a href="etkinlik-detay.html">Detay</a> | 
                <a href="etkinlik-ekle.html">Ekle</a>
            </p>
        </nav>
    </header>

    <main>
        <section>
            <h2>Etkinlik Güncelle</h2>

            <p>
                <a href="index.html">Ana Sayfa</a> 
                <a href="etkinlikler.html">Etkinlikler</a> 
                <a href="etkinlik-detay.html">Detay</a> 
                <a href="etkinlik-ekle.html">Ekle</a>
            </p>

            <form action="#" method="post">
                <p>
                    <label for="etkinlik-adi">Etkinlik Adı:</label><br>
                    <input type="text" id="etkinlik-adi" name="etkinlik_adi" value="Kariyer Günleri 2026" required>
                </p>

                <p>
                    <label for="kategori">Kategori:</label><br>
                    <select id="kategori" name="kategori" required>
                        <option value="seminer" selected>Seminer</option>
                        <option value="atolye">Atölye</option>
                        <option value="konferans">Konferans</option>
                        <option value="konser">Konser</option>
                        <option value="spor">Spor</option>
                    </select>
                </p>

                <p>
                    <label for="tarih">Tarih:</label><br>
                    <input type="date" id="tarih" name="tarih" value="2026-10-12" required>
                </p>

                <p>
                    <label for="saat">Saat:</label><br>
                    <input type="time" id="saat" name="saat" value="14:00" required>
                </p>

                <p>
                    <label for="yer">Yer:</label><br>
                    <input type="text" id="yer" name="yer" value="A Blok Konferans Salonu" required>
                </p>

                <p>
                    <label for="aciklama">Açıklama:</label><br>
                    <textarea id="aciklama" name="aciklama" rows="5" cols="40" required>Sektör temsilcilerinin katılımıyla mülakat simülasyonları ve CV hazırlama atölyeleri yapılacaktır.</textarea>
                </p>

                <p>
                    <button type="submit">Güncelle</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>Saimegül Yıldız · 2026</p>
    </footer>

</body>
</html>
